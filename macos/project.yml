name: ScriptForge
options:
  bundleIdPrefix: cn.scriptforge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 6CYMM92U6B
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  ScriptForgeMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/ScriptForgeMac
      - path: AppResources/ScriptForgeAura.icns
        buildPhase: resources
    info:
      path: AppResources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: 剧擎 ScriptForge
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 ScriptForge.
        CFBundleIconFile: ScriptForgeAura.icns
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsAutomaticGraphicsSwitching: true
    entitlements:
      path: AppResources/ScriptForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.scriptforge.mac
        PRODUCT_NAME: ScriptForge
        PRODUCT_MODULE_NAME: ScriptForgeMac
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        CODE_SIGN_STYLE: Automatic
        ARCHS: $(ARCHS_STANDARD)
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - package: ZIPFoundation
  ScriptForgeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ScriptForgeMacTests
    dependencies:
      - target: ScriptForgeMac
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.scriptforge.mac.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ScriptForge.app/Contents/MacOS/ScriptForge
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ScriptForge:
    build:
      targets:
        ScriptForgeMac: all
        ScriptForgeMacTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: ScriptForgeMacTests
    archive:
      config: Release
